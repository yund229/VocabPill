name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[dev] pyinstaller
      - name: Test
        run: pytest -q
      - name: Build exe
        run: pyinstaller --onefile --name vocabpill --add-data "vocabpill/data;vocabpill/data" vocabpill/__main__.py
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vocabpill.exe
          generate_release_notes: true
