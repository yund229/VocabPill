[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabpill"
version = "1.0.0"
description = "Desktop flashcard pop-ups for CET-4/CET-6 words. Zero dependencies, fully offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yund229" }]
keywords = ["vocabulary", "cet4", "cet6", "english", "flashcards", "spaced-repetition"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "Pillow>=9.0"]

[project.scripts]
vocabpill = "vocabpill.cli:main"

[project.urls]
Homepage = "https://github.com/yund229/VocabPill"
Issues = "https://github.com/yund229/VocabPill/issues"

[tool.setuptools]
packages = ["vocabpill"]

[tool.setuptools.package-data]
vocabpill = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
